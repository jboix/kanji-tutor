# The sync server behind Caddy, which gets and renews the HTTPS certificate on its own.
# Settings come from .env next to this file (copy .env.example). The image is the one the Sync
# workflow published; deploy.sh writes its tag (SYNC_TAG) into .env.
name: kanji-sync

services:
  sync:
    image: ${SYNC_IMAGE:-ghcr.io/jboix/kanji-sync}:${SYNC_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - sync-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - sync
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sync-data:
  caddy-data:
  caddy-config:
