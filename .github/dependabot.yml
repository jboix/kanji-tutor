version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      minor-and-patch:
        update-types: [minor, patch]
