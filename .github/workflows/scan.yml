name: Scan

# Security scans, on the same schedule as CodeQL's default setup: every push to main, every pull
# request to main, and weekly. Nothing here builds, publishes or deploys, and nothing fails a
# build: the findings go to the Security tab (code scanning) as SARIF, beside CodeQL's. On a pull
# request they show on the pull request; from a fork, whose token cannot upload, they stay in the
# job's log. Both tools run from their own actions, pinned by commit, which Dependabot updates
# with the other actions. On a pull request, the `report` job sums the findings up in one sticky
# comment, updated on every push.
#
# zizmor audits the workflows. Trivy checks the deploy files for misconfigurations, and the images
# the server runs, the sync server's latest and Caddy's, for known vulnerabilities.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        id: zimor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          inputs: .github
          advanced-security: ${{ !github.event.pull_request.head.repo.fork }}

      - name: Keep the results
        if: ${{ github.event_name == 'pull_request' && steps.zizmor.outputs.output-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-zizmor
          path: ${{ steps.zizmor.outputs.output-file }}
          retention-days: 1

  trivy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: apps/sync/deploy
          format: sarif
          output: trivy.sarif

      - name: Report
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      - name: Keep the results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-config
          path: trivy.sarif
          retention-days: 1

  trivy-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sync
            image: ghcr.io/jboix/kanji-sync:latest
          - name: caddy
            image: caddy:2-alpine
    steps:
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif

      - name: Report
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}

      - name: Keep the results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy-${{ matrix.name }}
          path: trivy.sarif
          retention-days: 1

  # One sticky comment on the pull request: findings per scan, and the first few of each. A fork's
  # token cannot comment; Dependabot's can, since the job asks for it.
  report:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    needs: [zizmor, trivy-config, trivy-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          JOBS: ${{ join(needs.*.result, ' ') }}
        run: |
          marker='<!-- scan-report -->'
          {
            echo "$marker"
            echo "### Security scan"
            echo
            echo "| Scan | Findings |"
            echo "| --- | --- |"
            for dir in sarif/sarif-*; do
              [ -d "$dir" ] || continue
              name="${dir#sarif/sarif-}"
              count=$(jq '[.runs[].results[]] | length' "$dir"/*)
              echo "| $name | $count |"
            done
            echo
            for dir in sarif/sarif-*; do
              [ -d "$dir" ] || continue
              jq -r --arg scan "${dir#sarif/sarif-}" '.runs[].results[:10][]
                | "- **\($scan)** `\(.ruleId)`: \(.message.text | split("\n")[0])"
                + " (\(.locations[0].physicalLocation.artifactLocation.uri // "image"))"' \
                "$dir"/*
            done
            case " $JOBS " in
              *" failure "*) echo; echo "A scan job failed; its findings may be missing." ;;
            esac
            echo
            echo "Commit $SHA. Details in the Security tab (code scanning)."
          } > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
