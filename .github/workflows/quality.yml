name: Quality

# Runs every gate on pull requests, the merge queue and main. The aggregate `quality` job is the
# single required check. Nothing here deploys or releases: see release.yml.
on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The coverage comment on a pull request. Dependabot's token is read-only unless asked.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Docs
        run: bun run docs:check
      - name: Layer rules
        run: bun run arch
      - name: Layer rules bite
        run: bun run arch:fixture
      - name: Unused code
        run: bun run knip
      - name: Unit tests
        run: bun run test
      # A sticky comment with the PWA's coverage, the changed files first. A fork's token cannot
      # comment, so its pull requests keep the summary in the job's log.
      - name: Coverage report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          working-directory: apps/web
          name: web
      - name: Build
        run: bun run build
      - name: Bundle budget
        run: bun run size

  # The quick subset (`test:e2e:smoke`): the app starts, the bar and Start work, one reading
  # session from end to end, and the accessibility scans of every screen and state. The full
  # suite runs nightly (e2e.yml) and before every release (release.yml).
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Playwright browsers
        uses: $/.github/actions/playwright-browsers

      # The e2e build uses the mock AI provider: no key, no network calls to Gemini.
      - name: Playwright (quick subset)
        run: bun run test:e2e:smoke

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke
          path: apps/web/playwright-report/
          retention-days: 7

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  quality:
    if: always()
    needs: [verify, e2e-smoke, commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not pass: $RESULTS"
              exit 1
            fi
          done
