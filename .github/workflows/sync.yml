name: Sync server

# Manual only, from main, like release.yml. The server is deployed by version, the app's: run
# Release first, then this. The build job checks out the latest release tag (vX.Y.Z), runs the
# checks once more, builds the sync server's image there and publishes it to GHCR as
# ghcr.io/<owner>/kanji-sync:X.Y.Z and :latest. The package is public, so the server pulls it
# without a token. The deploy job then waits for approval in the `sync` environment, which
# requires a reviewer, deploys from main only, and holds the SSH key.
#
# With `version`, nothing is built: that version's published image is deployed again, which is
# how to roll back.
#
# The deploy key can only run apps/sync/deploy/deploy.sh on the server: a forced command in
# authorized_keys. The job sends the version and that release's compose.yaml and Caddyfile; the
# script backs up the database, runs the image, checks /health, and puts the previous version
# back when that fails. The server's .env, with SAVE_KEY, never leaves the server.
#
# The `sync` environment holds the secret SYNC_SSH_KEY (the deploy key's private half) and the
# variables SYNC_HOST, SYNC_USER, SYNC_DOMAIN and SYNC_KNOWN_HOSTS (`ssh-keyscan` of the host,
# checked against the server's own fingerprints).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Deploy this published version again instead of building the latest (a rollback), e.g. 1.2.0
        required: false
        default: ''

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest vX.Y.Z on main; commits after it are not deployed until Release tags them.
      - name: Check out the latest release
        id: release
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
          git checkout --quiet "$tag"
          if [ ! -d apps/sync/deploy ]; then
            echo "::error::$tag has no sync server: run Release first"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Building $tag ($(git rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: bun install --frozen-lockfile

      # Every gate, as for a release; it ends with `sync:build`, the bundle the image copies.
      - name: Check
        run: bun run check

      - name: Build the image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kanji-sync"
          docker build \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$image:$VERSION" --tag "$image:latest" \
            apps/sync/deploy
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      # Trivy, run from its image pinned by digest: no image is published with a HIGH or
      # CRITICAL vulnerability that has a fix. Ones without a fix are reported by scan.yml.
      - name: Scan the image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --quiet --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:$VERSION"

      - name: Publish to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker logout ghcr.io

  deploy:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.version != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: sync
      url: https://${{ vars.SYNC_DOMAIN }}/health
    permissions:
      contents: read
    steps:
      - name: Choose the version
        id: version
        env:
          BUILT: ${{ needs.build.outputs.version }}
          ROLLBACK: ${{ inputs.version }}
        run: |
          version="${ROLLBACK:-$BUILT}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout that release's deploy files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.version.outputs.version }}
          sparse-checkout: apps/sync/deploy
          persist-credentials: false

      - name: Deploy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SSH_KEY: ${{ secrets.SYNC_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SYNC_KNOWN_HOSTS }}
          SYNC_HOST: ${{ vars.SYNC_HOST }}
          SYNC_USER: ${{ vars.SYNC_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -c -C apps/sync/deploy compose.yaml Caddyfile |
            ssh -i ~/.ssh/deploy-key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes "$SYNC_USER@$SYNC_HOST" "$VERSION"

      - name: Check from outside
        env:
          SYNC_DOMAIN: ${{ vars.SYNC_DOMAIN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          health="$(curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://$SYNC_DOMAIN/health")"
          echo "$health"
          if [[ "$health" != *"\"version\":\"$VERSION\""* ]]; then
            echo "::error::the server answers, but not with $VERSION"
            exit 1
          fi

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy-key
